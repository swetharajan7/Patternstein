<!-- Add these styles to your <style> section in the <head> -->
<style>
    .sample-gallery-section {
        background: rgba(0, 212, 255, 0.05);
        border: 2px solid rgba(0, 212, 255, 0.3);
        border-radius: 20px;
        padding: 40px;
        margin-top: 40px;
    }

    .sample-gallery-section h3 {
        color: #00d4ff;
        font-size: 2rem;
        text-align: center;
        margin-bottom: 15px;
    }

    .gallery-subtitle {
        text-align: center;
        color: #ccc;
        margin-bottom: 30px;
        font-size: 1.1rem;
    }

    .tissue-tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 40px;
    }

    .tissue-tab {
        padding: 12px 24px;
        background: rgba(0, 212, 255, 0.1);
        border: 2px solid rgba(0, 212, 255, 0.3);
        border-radius: 10px;
        color: #ccc;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Courier New', monospace;
    }

    .tissue-tab:hover {
        border-color: #00d4ff;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
    }

    .tissue-tab.active {
        background: linear-gradient(135deg, #00d4ff 0%, #00e6ff 100%);
        border-color: #00d4ff;
        color: #000;
        font-weight: bold;
        box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
    }

    .sample-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 30px;
        margin-top: 30px;
    }

    .sample-card {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(0, 212, 255, 0.3);
        border-radius: 15px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .sample-card:hover {
        transform: translateY(-5px);
        border-color: #00d4ff;
        box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }

    .sample-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #1a0a14 0%, #2d1428 100%);
    }

    .sample-label {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
    }

    .sample-label.normal {
        color: #00ff88;
    }

    .sample-label.abnormal {
        color: #ff6b6b;
    }

    .sample-description {
        color: #ccc;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 10px;
        line-height: 1.4;
    }

    .sample-credit {
        color: #888;
        font-size: 0.75rem;
        text-align: center;
        font-style: italic;
    }

    .try-sample-btn {
        width: 100%;
        padding: 12px;
        background: rgba(0, 212, 255, 0.2);
        border: 2px solid rgba(0, 212, 255, 0.5);
        border-radius: 8px;
        color: #fff;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        font-family: 'Courier New', monospace;
    }

    .try-sample-btn:hover {
        background: rgba(0, 212, 255, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
    }

    /* Light mode adjustments */
    body.light-mode .sample-gallery-section {
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid rgba(0, 212, 255, 0.3);
    }

    body.light-mode .sample-gallery-section h3 {
        color: #0088cc;
    }

    body.light-mode .gallery-subtitle {
        color: #4a5568;
    }

    body.light-mode .tissue-tab {
        background: rgba(240, 248, 255, 0.8);
        border: 2px solid rgba(0, 212, 255, 0.3);
        color: #4a5568;
    }

    body.light-mode .tissue-tab.active {
        background: linear-gradient(135deg, #0088cc 0%, #00aaff 100%);
        color: #fff;
    }

    body.light-mode .sample-card {
        background: rgba(240, 248, 255, 0.8);
        border: 2px solid rgba(0, 212, 255, 0.2);
    }

    body.light-mode .sample-description {
        color: #4a5568;
    }

    body.light-mode .try-sample-btn {
        background: rgba(0, 212, 255, 0.1);
        border: 2px solid rgba(0, 212, 255, 0.3);
        color: #0088cc;
    }

    body.light-mode .try-sample-btn:hover {
        background: rgba(0, 212, 255, 0.2);
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
        .tissue-tabs {
            gap: 8px;
        }

        .tissue-tab {
            padding: 10px 16px;
            font-size: 0.9rem;
        }

        .sample-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<!-- HTML Section - Insert this in your page body -->
<div class="sample-gallery-section">

    <p class="gallery-subtitle">
        Click any sample to instantly analyze it with our AI. No upload needed!

    <!-- Tissue Type Tabs -->
    <div class="tissue-tabs">

    <!-- Sample Grid -->
    <div class="sample-grid" id="sampleGrid">

    </div>
</div>

    // Initialize gallery with breast samples
    document.addEventListener('DOMContentLoaded', function() {
        showTissueSamples('breast', null);
    });

    function showTissueSamples(tissueType, event) {
        // Update tab states
        document.querySelectorAll('.tissue-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        if (event) {
            event.target.classList.add('active');
        } else {
            // Initial load
            document.querySelector('.tissue-tab').classList.add('active');
        }

        // Get samples for this tissue type
        const samples = SAMPLE_DATA[tissueType];
        const grid = document.getElementById('sampleGrid');

        // Build HTML
        grid.innerHTML = samples.map(sample => `
            <div class="sample-card" onclick="loadSampleImage('${tissueType}', '${sample.type}')">
                <img src="${sample.image}" alt="${sample.label}" 
                     onerror="this.src='${sample.placeholder}'">
                <div class="sample-label ${sample.type === 'normal' ? 'normal' : 'abnormal'}">${sample.label}</div>
                <div class="sample-description">${sample.description}</div>
                <div class="sample-credit">${sample.credit}</div>
                <button class="try-sample-btn" onclick="event.stopPropagation(); loadSampleImage('${tissueType}', '${sample.type}')">
                    🔍 Analyze This Sample
                </button>
            </div>
        `).join('');
    }

    function loadSampleImage(tissueType, sampleType) {
        // Find the sample data
        const sample = SAMPLE_DATA[tissueType].find(s => s.type === sampleType);
        if (!sample) return;

        // Try to load the real image, fall back to placeholder
        const imageUrl = sample.image;
        
        fetch(imageUrl)
            .then(response => {
                if (!response.ok) throw new Error('Image not found');
                return response.blob();
            })
            .catch(() => {
                // If real image fails, use placeholder
                return fetch(sample.placeholder).then(r => r.blob());
            })
            .then(blob => {
                const file = new File([blob], `${tissueType}_${sampleType}.jpg`, { type: 'image/jpeg' });
                handleFile(file);
                
                // Scroll to the analyzer
                const uploadArea = document.getElementById('uploadArea');
                if (uploadArea) {
                    uploadArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            })
            .catch(error => {
                console.error('Error loading sample:', error);
                alert('Could not load sample image. Please try uploading your own image.');
            });
    }
</script>
