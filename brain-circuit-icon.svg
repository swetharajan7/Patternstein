<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left side - Circuit board -->
  <g stroke="url(#brainGradient)" stroke-width="2" fill="none">
    <!-- Circuit traces -->
    <path d="M 30 50 L 50 50 L 50 70 L 70 70" />
    <path d="M 30 80 L 60 80 L 60 100" />
    <path d="M 40 110 L 70 110 L 70 130" />
    <path d="M 35 140 L 55 140 L 55 160" />
    
    <!-- Circuit nodes -->
    <circle cx="30" cy="50" r="3" fill="#00d4ff" />
    <circle cx="70" cy="70" r="3" fill="#00d4ff" />
    <circle cx="60" cy="100" r="3" fill="#00d4ff" />
    <circle cx="70" cy="130" r="3" fill="#00d4ff" />
    <circle cx="55" cy="160" r="3" fill="#00d4ff" />
  </g>
  
  <!-- Right side - Brain -->
  <g stroke="url(#brainGradient)" stroke-width="2.5" fill="none">
    <!-- Brain outline -->
    <path d="M 100 30 Q 120 25 135 35 Q 150 45 155 60 Q 160 80 155 100 Q 150 120 140 135 Q 130 150 115 160 Q 100 165 90 160 Q 80 155 75 145 Q 70 130 70 115 Q 68 95 70 80 Q 72 60 80 45 Q 88 32 100 30 Z" />
    
    <!-- Brain folds -->
    <path d="M 100 40 Q 110 45 115 55" />
    <path d="M 120 50 Q 125 60 125 70" />
    <path d="M 130 65 Q 135 75 135 90" />
    <path d="M 140 85 Q 140 100 135 115" />
    <path d="M 130 120 Q 125 130 115 140" />
    <path d="M 105 145 Q 95 145 88 140" />
    <path d="M 85 130 Q 80 120 78 105" />
    <path d="M 78 95 Q 80 80 85 70" />
    <path d="M 90 60 Q 95 50 100 45" />
  </g>
  
  <!-- Connection between circuit and brain -->
  <line x1="70" y1="100" x2="90" y2="100" stroke="url(#brainGradient)" stroke-width="2" stroke-dasharray="3,3" />
  
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#brainGradient)" stroke-width="1" opacity="0.2" />
</svg>
