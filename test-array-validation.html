<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tips Array Validation Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            color: #00d4ff;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-title {
            color: #00ff88;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .test-result {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .test-pass {
            background: rgba(0, 255, 136, 0.2);
            border-left: 4px solid #00ff88;
        }
        
        .test-fail {
            background: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff0000;
        }
        
        .test-info {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
            padding: 10px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        
        .summary {
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }
        
        .summary h2 {
            color: #00ff88;
            margin-bottom: 15px;
        }
        
        .tip-list {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tip-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            font-size: 0.9rem;
        }
        
        .tip-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Health Tips Array Validation Test</h1>
    
    <div class="test-section">
        <div class="test-title">Test 3.4: Array Validation</div>
        <div class="test-info">
            <strong>Requirement:</strong> 2.1 - THE system SHALL maintain a collection of at least 10 unique health tips<br>
            <strong>Expected:</strong> Tips array should have at least 10 unique items
        </div>
        <div id="test-3-4-results"></div>
    </div>
    
    <div class="summary" id="summary"></div>
    
    <script>
        // Health tips array (same as in index.html)
        const healthTips = [
            "Stay hydrated: Drink 8 glasses of water daily 💧",
            "Get 7-9 hours of sleep for optimal health 😴",
            "Exercise 30 minutes daily to boost immunity 🏃",
            "Eat colorful fruits & vegetables every day 🥗",
            "Wash hands frequently to prevent illness 🧼",
            "Take breaks from screens every 20 minutes 👀",
            "Practice deep breathing to reduce stress 🧘",
            "Schedule regular health check-ups 🩺",
            "Limit processed foods and added sugars 🍎",
            "Stay socially connected for mental health 💬",
            "Protect your skin with daily sunscreen ☀️",
            "Maintain good posture to prevent back pain 🪑"
        ];
        
        let testResults = {
            passed: 0,
            failed: 0,
            total: 0
        };
        
        function logTest(testName, passed, message) {
            testResults.total++;
            if (passed) {
                testResults.passed++;
            } else {
                testResults.failed++;
            }
            
            const resultDiv = document.createElement('div');
            resultDiv.className = passed ? 'test-result test-pass' : 'test-result test-fail';
            resultDiv.innerHTML = `
                <strong>${passed ? '✓ PASS' : '✗ FAIL'}:</strong> ${testName}<br>
                <span style="font-size: 0.9rem; opacity: 0.8;">${message}</span>
            `;
            return resultDiv;
        }
        
        // Test 3.4: Array validation
        function testArrayValidation() {
            const resultsContainer = document.getElementById('test-3-4-results');
            
            // Test 1: Array exists and is not empty
            const test1 = Array.isArray(healthTips) && healthTips.length > 0;
            resultsContainer.appendChild(
                logTest(
                    'Health tips array exists and is not empty',
                    test1,
                    test1 
                        ? `Array exists with ${healthTips.length} items` 
                        : 'Array is missing or empty'
                )
            );
            
            // Test 2: Array has at least 10 items
            const test2 = healthTips.length >= 10;
            resultsContainer.appendChild(
                logTest(
                    'Array has at least 10 items',
                    test2,
                    test2 
                        ? `Array has ${healthTips.length} items (minimum 10 required)` 
                        : `Array only has ${healthTips.length} items (minimum 10 required)`
                )
            );
            
            // Test 3: All items are unique
            const uniqueTips = new Set(healthTips);
            const test3 = uniqueTips.size === healthTips.length;
            resultsContainer.appendChild(
                logTest(
                    'All tips are unique (no duplicates)',
                    test3,
                    test3 
                        ? `All ${healthTips.length} tips are unique` 
                        : `Found ${healthTips.length - uniqueTips.size} duplicate(s). Unique tips: ${uniqueTips.size}`
                )
            );
            
            // Test 4: All items are strings
            const allStrings = healthTips.every(tip => typeof tip === 'string');
            const test4 = allStrings;
            resultsContainer.appendChild(
                logTest(
                    'All tips are strings',
                    test4,
                    test4 
                        ? 'All tips are valid strings' 
                        : 'Some tips are not strings'
                )
            );
            
            // Test 5: No empty strings
            const noEmptyStrings = healthTips.every(tip => tip.trim().length > 0);
            const test5 = noEmptyStrings;
            resultsContainer.appendChild(
                logTest(
                    'No empty or whitespace-only tips',
                    test5,
                    test5 
                        ? 'All tips have content' 
                        : 'Some tips are empty or whitespace-only'
                )
            );
            
            // Test 6: Combined requirement - at least 10 unique tips
            const test6 = healthTips.length >= 10 && uniqueTips.size >= 10;
            resultsContainer.appendChild(
                logTest(
                    'Array has at least 10 unique tips (Requirement 2.1)',
                    test6,
                    test6 
                        ? `✓ Requirement satisfied: ${uniqueTips.size} unique tips` 
                        : `✗ Requirement not satisfied: Only ${uniqueTips.size} unique tips (need 10)`
                )
            );
            
            // Display the tips list
            const tipListDiv = document.createElement('div');
            tipListDiv.className = 'tip-list';
            tipListDiv.innerHTML = '<strong>All Tips:</strong><br>';
            healthTips.forEach((tip, index) => {
                const tipItem = document.createElement('div');
                tipItem.className = 'tip-item';
                tipItem.textContent = `${index + 1}. ${tip}`;
                tipListDiv.appendChild(tipItem);
            });
            resultsContainer.appendChild(tipListDiv);
        }
        
        // Run tests on page load
        document.addEventListener('DOMContentLoaded', function() {
            testArrayValidation();
            
            // Display summary
            const summaryDiv = document.getElementById('summary');
            const allPassed = testResults.failed === 0;
            summaryDiv.innerHTML = `
                <h2>${allPassed ? '✓ All Tests Passed!' : '⚠ Some Tests Failed'}</h2>
                <p style="font-size: 1.2rem;">
                    <strong>${testResults.passed}</strong> passed, 
                    <strong>${testResults.failed}</strong> failed, 
                    <strong>${testResults.total}</strong> total
                </p>
                ${allPassed 
                    ? '<p style="color: #00ff88;">The health tips array meets all requirements!</p>' 
                    : '<p style="color: #ff6b6b;">Please review the failed tests above.</p>'}
            `;
        });
    </script>
</body>
</html>
